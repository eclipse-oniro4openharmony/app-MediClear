services:
  mediclear-backend:
    build: .
    container_name: mediclear-backend
    depends_on:
      - mongo
    ports:
      - "18080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      MONGO_URL: "mongodb://mongo:27017"
      MONGO_DB_NAME: "${MONGO_DB_NAME:-mediclear}"
      PDF_TEXT_MIN_LENGTH: "${PDF_TEXT_MIN_LENGTH:-300}"
      CHUNK_SIZE: "${CHUNK_SIZE:-1200}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP:-160}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mediclear-mongo
    volumes:
      - mediclear_mongo_data:/data/db
    restart: unless-stopped

volumes:
  mediclear_mongo_data:
